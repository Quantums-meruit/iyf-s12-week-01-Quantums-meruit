<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Joseph</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <nav class="nav">
            <h2 class="nav__logo">Joseph</h2>

            <ul class="nav__list">
                <li><a class="nav__link" href="index.html">Home</a></li>
                <li><a class="nav__link" href="about.html">About</a></li>
                <li><a class="nav__link" href="projects.html">Projects</a></li>
                <li><a class="nav__link nav__link--active" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">

        <section class="contact">
            <h1>Contact Me</h1>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="project">Project</option>
                    <option value="question">Question</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>

            </form>
        </section>

        <section>
            <h2>Social Media</h2>

            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </section>

        <section>
            <h2>Location & Timezone</h2>

            <address>
                Nairobi, Kenya<br>
                East Africa Time (EAT)<br>
                UTC+3
            </address>
        </section>

    </main>

</body>
</html>
